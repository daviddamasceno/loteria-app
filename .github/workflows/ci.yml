name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

env:
  IMAGE_NAME: loteria-app
  IMAGE_TAG: ${{ github.sha }}

jobs:
  pre_build_checks:
    name: Code Quality & Security (Source)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks (Secrets Scanner)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # Adicionamos pytest, pytest-cov, httpx e pip-audit para testes e segurança
          pip install flake8 bandit pytest pytest-cov httpx pip-audit

      - name: Code Linting (flake8)
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=app/tests/
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --exclude=app/tests/

      - name: SAST with Bandit
        run: |
          bandit -r app/ -x app/tests/

      - name: Run Tests & Check Coverage
        run: |
          # Executa os testes e quebra a Action se a cobertura for menor que 80%
          # Exibe as linhas não cobertas no log (term-missing)
          pytest --cov=app --cov-fail-under=80 --cov-report=term-missing

      - name: Run pip-audit (Dependency Security)
        run: |
          # Varre as dependências instaladas e o requirements em busca de vulnerabilidades (CVEs)
          # O '|| true' faz com que ele não quebre a pipeline (se preferir bloquear, basta remover)
          pip-audit -r requirements.txt -f html -o pip-audit-report.html || true

      - name: Upload pip-audit Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pip-audit-report
          path: pip-audit-report.html

  build_and_push:
    name: Build, Scan & Push Image
    needs: pre_build_checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Check if Docker Tag Exists
        id: check_tag
        run: |
          if docker manifest inspect ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} > /dev/null 2>&1; then
            echo "Error: Tag ${{ env.IMAGE_TAG }} already exists on Docker Hub. Aborting to prevent overwrite."
            exit 1
          else
            echo "Tag does not exist. Proceeding with build."
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}'
          format: 'template'
          template: '@/contrib/html.tpl'
          output: 'trivy-report.html'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-report
          path: 'trivy-report.html'

      - name: Push Docker Image
        if: success()
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest
